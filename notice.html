<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b10" />
    <meta name="description" content="访问提示：该功能仅限社团内部使用。" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./assets/images/og-cover.jpg" />
    <meta property="og:title" content="访问提示 · 网络安全社" />
    <meta property="og:description" content="访问提示：该功能仅限社团内部使用。" />
    <link rel="icon" href="./assets/images/ui/logo/favicon.ico" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./assets/images/ui/logo/favicon.ico" />
    <title>访问提示 · 网络安全社</title>
    <link rel="stylesheet" href="./src/styles/base.css" />
    <link rel="stylesheet" href="./src/styles/direction.css" />
  </head>
  <body>
    <script src="./src/scripts/landscape.js?v=20260924a"></script>
    <main class="direction-shell">
      <!-- 品牌标记：左上角，风格与主站一致 -->
      <header class="brand-mark">
        <p class="brand-mark__title">网络安全社</p>
        <div class="brand-mark__meta-wrap">
          <p class="brand-mark__meta">CYBER SECURITY CLUB</p>
          <p class="brand-mark__meta">访问提示 NOTICE</p>
        </div>
      </header>

      <!-- 提示卡片：复用方向详情页的视觉风格 -->
      <section class="direction-card">
        <div class="direction-card__frame" aria-hidden="true">
          <span class="direction-card__corner direction-card__corner--tl"></span>
          <span class="direction-card__corner direction-card__corner--tr"></span>
          <span class="direction-card__corner direction-card__corner--bl"></span>
          <span class="direction-card__corner direction-card__corner--br"></span>
        </div>

        <div class="direction-card__content">
          <p class="direction-card__eyebrow">EXTERNAL ACCESS · 外部访问</p>
          <h1 class="direction-card__title">提示</h1>
          <p class="direction-card__quote">
            很抱歉，该功能仅能在社团内部使用，不支持外部访问。
          </p>
          <a class="direction-card__back" href="./index.html">返回主站 ← BACK</a>
        </div>
      </section>
    </main>
    <script>
      /* 返回主站：若带 from 参数，回到进入前所在的栏目，否则回首页 */
      (function () {
        var btn = document.querySelector(".direction-card__back");
        if (!btn) return;
        var from = new URLSearchParams(window.location.search).get("from");
        if (from) btn.href = "index.html?from=" + encodeURIComponent(from);
      })();
    </script>
    <script>
      /* 回到顶部按钮（滚动一定距离后出现） */
      (function () {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "back-to-top";
        btn.setAttribute("aria-label", "回到顶部");
        btn.textContent = "↑";
        document.body.appendChild(btn);
        btn.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });
        function upd() { btn.classList.toggle("is-show", window.scrollY > 300); }
        window.addEventListener("scroll", upd, { passive: true });
        upd();
      })();
    </script>
  </body>
</html>
