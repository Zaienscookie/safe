<title>FLAG 挑战 · 网络安全社</title>

<style>
  /* —— FLAG 表单与结果样式 —— */
  .flag-form {
    display: flex;
    gap: 0.7rem;
    margin-top: 1.6rem;
    flex-wrap: wrap;
  }

  .flag-form__input {
    flex: 1 1 18rem;
    padding: 0.85rem 1rem;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.05);
    color: #e8e6df;
    font-family: Consolas, "Microsoft YaHei", monospace;
    font-size: 0.9rem;
    letter-spacing: 0.06em;
    transition: border-color 0.3s;
  }
  .flag-form__input:focus {
    outline: none;
    border-color: rgba(255, 140, 0, 0.6);
  }

  .flag-form__btn {
    padding: 0.85rem 1.8rem;
    border: 1px solid rgba(255, 140, 0, 0.45);
    border-radius: 8px;
    background: linear-gradient(90deg, rgba(255, 140, 0, 0.95), rgba(255, 166, 44, 0.95));
    color: #101010;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .flag-form__btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 24px rgba(255, 140, 0, 0.25);
  }

  .flag-result {
    margin-top: 1.3rem;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    min-height: 1.6em;
  }
  .flag-result.is-ok   { color: #4ade80; }
  .flag-result.is-fail { color: #f87171; }

  /* —— 查看网页源码（手机端没有 F12 / 查看源代码，用它补足） —— */
  .flag-src-btn {
    margin-top: 0.9rem;
    padding: 0.45rem 1rem;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 6px;
    background: transparent;
    color: #cfcdc6;
    font-family: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    cursor: pointer;
    transition: color 0.3s, border-color 0.3s;
  }
  .flag-src-btn:hover { color: #ff8c00; border-color: rgba(255, 140, 0, 0.5); }

  .flag-src {
    position: fixed;
    inset: 0;
    z-index: 99998;
    display: flex;
    flex-direction: column;
    background: rgba(8, 8, 12, 0.97);
  }
  .flag-src[hidden] { display: none; }
  .flag-src__bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.8rem;
    padding: 0.8rem 1rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    color: #ff8c00;
  }
  .flag-src__close {
    padding: 0.35rem 0.9rem;
    border: 1px solid rgba(255, 140, 0, 0.5);
    border-radius: 6px;
    background: transparent;
    color: #ffc98a;
    font-family: inherit;
    font-size: 0.72rem;
    cursor: pointer;
  }
  .flag-src__code {
    flex: 1;
    margin: 0;
    padding: 1rem;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    font-family: Consolas, Menlo, monospace;
    font-size: 12px;
    line-height: 1.7;
    color: #cfcdc6;
    white-space: pre-wrap;
    word-break: break-all;
  }
</style>

<body>
<script src="./src/scripts/landscape.js?v=20260924a"></script>
<main class="direction-shell">
  <!-- 品牌标记：WELCOME TO JOIN CYBERSECURITY CLUB -->
  <header class="brand-mark">
    <p class="brand-mark__title">网络安全社</p>
    <div class="brand-mark__meta-wrap">
      <p class="brand-mark__meta">FLAG CHALLENGE · 挑战</p>
    </div>
  </header>

  <section class="direction-card">
    <div class="direction-card__frame" aria-hidden="true">
      <span class="direction-card__corner direction-card__corner--tl"></span>
      <span class="direction-card__corner direction-card__corner--tr"></span>
      <span class="direction-card__corner direction-card__corner--bl"></span>
      <span class="direction-card__corner direction-card__corner--br"></span>
    </div>

    <div class="direction-card__content">
      <p class="direction-card__eyebrow">CTF · WEB</p>
      <h1 class="direction-card__title">FLAG 挑战</h1>

      <p class="direction-card__slogan">一个 flag 就藏在本页的源代码里，找到它并提交。</p>

      <div class="honor-body" style="margin-top:1.2rem;">
        <p style="margin:0;">
          小提示：在页面空白处右键查看网页源代码，翻翻注释；flag 通常形如
          <code style="color:#ffc98a;">flag{...}</code>，内容与该页主题相关。
          找到后输入下方输入框并提交。
        </p>
      </div>

      <button class="flag-src-btn" id="flag-src-btn" type="button">查看源码 · VIEW SOURCE</button>

      <!-- 提交区 -->
      <div class="flag-form">
        <input class="flag-form__input" id="flag-input" type="text" placeholder="在这里输入 flag{...}" autocomplete="off" aria-label="FLAG 输入框">
        <button class="flag-form__btn" id="flag-submit" type="button">提交 SUBMIT</button>
      </div>
      <p class="flag-result" id="flag-result" aria-live="polite"></p>

      <a class="direction-card__back" href="./index.html" id="back-btn">返回主站 ← BACK</a>
    </div>
  </section>
</main>

<!-- 网页源码查看层：手机端替代 F12 / 查看源代码 -->
<div class="flag-src" id="flag-src" hidden>
  <div class="flag-src__bar">
    <span>PAGE SOURCE · 网页源码</span>
    <button class="flag-src__close" id="flag-src-close" type="button">关闭 ×</button>
  </div>
  <pre class="flag-src__code" id="flag-src-code"></pre>
</div>

<!-- ============================================================
     ★ 关卡旗标（FLAG）
     flag{WELCOME_TO_JOIN_THE_CYBERSECURITY_CLUB}
     说明：意为“欢迎加入网络安全社”。请勿移除本注释，否则题目失分。
     ============================================================ -->

<script>
  /* FLAG 校验（纯前端、无存储）：英文“欢迎加入网络安全社” */
  (function () {
    var FLAG = "flag{welcome_to_join_the_cybersecurity_club}";
    var input = document.getElementById("flag-input");
    var submit = document.getElementById("flag-submit");
    var result = document.getElementById("flag-result");

    function check() {
      var val = (input.value || "").trim().toLowerCase();
      result.classList.remove("is-ok", "is-fail");
      if (val === FLAG) {
        result.classList.add("is-ok");
        result.textContent = "恭喜，回答正确！";
      } else {
        result.classList.add("is-fail");
        result.textContent = "回答错误，再想想看。";
      }
    }
    submit.addEventListener("click", check);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") check(); });
  })();

  /* 返回主站：若带 from 参数，回到进入前所在的栏目 */
  (function () {
    var from = new URLSearchParams(window.location.search).get("from");
    if (from) document.getElementById("back-btn").href = "index.html?from=" + encodeURIComponent(from);
  })();
</script>

<script>
  /* 查看网页源码：手机端大多没有 F12 / 查看源代码，用这个按钮补足 */
  (function () {
    var btn = document.getElementById("flag-src-btn");
    var box = document.getElementById("flag-src");
    var code = document.getElementById("flag-src-code");
    var closeBtn = document.getElementById("flag-src-close");
    if (!btn || !box || !code) return;

    function open() {
      box.hidden = false;
      if (code.dataset.loaded === "1") return;
      code.textContent = "加载中…";
      // 优先抓取原始 HTML（保证注释/flag 原样呈现）；失败时回退到当前 DOM 序列化
      fetch(window.location.href, { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("bad"); return r.text(); })
        .then(function (text) { code.textContent = text; code.dataset.loaded = "1"; })
        .catch(function () {
          code.textContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
          code.dataset.loaded = "1";
        });
    }

    function close() { box.hidden = true; }

    btn.addEventListener("click", open);
    closeBtn.addEventListener("click", close);
    box.addEventListener("click", function (e) { if (e.target === box) close(); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !box.hidden) close();
    });
  })();
</script>
</body>
</html>
